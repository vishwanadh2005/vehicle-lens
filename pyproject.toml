[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-lens"
version = "0.1.0"
description = "Airplane, boat, and car detection with open-vocabulary model ranking"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.45,<5", "Pillow>=10,<13", "opencv-python-headless>=4.10,<6", "numpy>=1.26,<3"]

[project.optional-dependencies]
demo = ["streamlit>=1.40,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
vehicle-lens = "vehicle_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vehicle_lens = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
